<style>
  /* 這裡修正了高度，確保左側黃色拉到最底 */

  .date-btn:hover, .date-btn.active { background-color: #f57f17; color: #ffffff; }

  /* 控制功能按鈕的外觀與顏色 */
  .btn-group { display: flex; gap: 8px; }

  .action-btn:hover { opacity: 0.9; }
  .action-btn:nth-child(1) { background-color: #757575; } /* 灰色排序 */
  .reset-btn { background-color: #da373c; } /* 紅色重設 */
  .next-btn { background-color: #248046; } /* 綠色下一步 */

  /* 訊息對話區域 */
  .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 60px; background-color: #ffffff; }
  .msg-item { display: flex; gap: 15px; animation: fadeIn 0.2s ease-in-out; }

  .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #bdbdbd; object-fit: cover; }
  .msg-content { display: flex; flex-direction: column; gap: 2px; }
  .msg-info { display: flex; align-items: baseline; gap: 8px; }

  /* 名字與內文全部改成黑色 */
  .username { color: #000000; font-weight: bold; }
  .timestamp { color: #757575; font-size: 12px; }
  .text-text { color: #000000; font-size: 15px; white-space: pre-wrap; }
  .img-box img { max-width: 250px; max-height: 180px; border-radius: 8px; margin-top: 5px; border: 1px solid #e0e0e0; }

  /* 底部提示欄 */
  .hint-bar { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.05); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: #616161; border: 1px solid #e0e0e0; pointer-events: none; }
</style>

  let currentDay = 'day1';
  let isAscending = true;

   let statusState = { 
        day1: { index: 0, list: [] }, 
        day2: { index: 0, list: [] }, 
        day3: { index: 0, list: [] }, 
        day4: { index: 0, list: [] }, 
        day5: { index: 0, list: [] },
        day6: { index: 0, list: [] }, 
        day7: { index: 0, list: [] }, 
        day8: { index: 0, list: [] } 
    };
  function initAllData() {
      Object.keys(chatData).forEach(day => {
          statusState[day].list = [...chatData[day]];
          statusState[day].list.sort((a, b) => isAscending ? a.time.localeCompare(b.time) : b.time.localeCompare(a.time));
      });
  }

  function showNextMessage() {
      const state = statusState[currentDay];
      if (state.index >= state.list.length) {
          alert('這天的聊天記錄已經播完囉！');
          return;
      }

      const chatBox = document.getElementById(`box-${currentDay}`);
      const msg = state.list[state.index];
      let contentHTML = msg.type === 'text'
          ? `<span class="text-text">${msg.content}</span>`
          : `<div class="img-box"><img src="${msg.content}"></div>`;

      chatBox.innerHTML += `
          <div class="msg-item">
              <img class="avatar" src="${msg.avatar}">
              <div class="msg-content">
                  <div class="msg-info">
                      <span class="username">${msg.name}</span>
                      <span class="timestamp">${msg.time}</span>
                  </div>
                  ${contentHTML}
              </div>
          </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;
      state.index++;
  }

  function switchTab(day, buttonElement) {
      document.getElementById(`box-${currentDay}`).style.display = 'none';
      currentDay = day;
      document.getElementById(`box-${currentDay}`).style.display = 'flex';
      document.getElementById('current-date-title').innerText = buttonElement.innerText;
      document.querySelectorAll('.date-btn').forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
  }

  function resetCurrentChat() {
      statusState[currentDay].index = 0;
      document.getElementById(`box-${currentDay}`).innerHTML = '';
  }

  function toggleSort() {
      isAscending = !isAscending;
      initAllData();
      Object.keys(chatData).forEach(day => {
          statusState[day].index = 0;
          document.getElementById(`box-${day}`).innerHTML = '';
      });
      alert('已切換時間排序方式，所有日期已重設並保留在原本頁面。');
  }

  initAllData();
</script>
